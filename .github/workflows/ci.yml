name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The event name is part of the group so a normal push run can never cancel an
  # intentional manual release run (or vice versa). Releasing by dispatch is only
  # meaningful if a later merge cannot abort it mid-flight.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: placeholder
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run skills:registry:check
      - run: npm run skills:index:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Playwright E2E — real UI login + tenant-isolation smoke against a local
  # production build (npm run build + next start). Requires E2E_TEST_EMAIL /
  # E2E_TEST_PASSWORD (and, for the app itself to authenticate,
  # NEXT_PUBLIC_SUPABASE_URL /
  # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY) as repo secrets — a maintainer
  # with repo admin must add these; until then this job fails with the
  # harness's own clear "credentials missing" error, not a silent skip.
  # Most IPI-1066-dependent specs are `test.fixme` until
  # https://github.com/amoai-tech/ipixai/pull/52 merges — see e2e/*.spec.ts.
  # `npm run e2e` only runs the chromium/mobile-chromium projects (see
  # playwright.config.ts) — deliberately deterministic, no hosted AI-provider
  # dependency, so this job (a required merge check) never goes red because
  # OpenAI is slow/down/out of quota. The one spec that makes a real hosted
  # GPT-4o call (planner-journey.spec.ts) plus copilot-intelligence-isolation
  # live in the separate chromium-ai-smoke project and run from
  # .github/workflows/ai-smoke.yml, outside deterministic release CI.
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_EMAIL_ORG_B: ${{ secrets.E2E_TEST_EMAIL_ORG_B }}
      E2E_TEST_PASSWORD_ORG_B: ${{ secrets.E2E_TEST_PASSWORD_ORG_B }}
      E2E_TEST_EMAIL_SHOOTS: ${{ secrets.E2E_TEST_EMAIL_SHOOTS }}
      E2E_TEST_PASSWORD_SHOOTS: ${{ secrets.E2E_TEST_PASSWORD_SHOOTS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      # Test a production build, not `next dev`: compiling routes on demand
      # grew the dev server to ~13 GB and the 16 GB runner was killed mid-suite.
      # NEXT_PUBLIC_* values are inlined here, so build with the job env.
      - run: npm run build
        env:
          OPENAI_API_KEY: placeholder
      - run: npm run e2e
        env:
          E2E_SERVER: production
          # Opts the test-only Planner seed route into this production build
          # (never enabled on Vercel; see src/lib/planner/seed-routes.ts).
          IPIX_E2E_SEED_ROUTES: "1"
      # This repository is public and these tests reuse real authenticated
      # Supabase sessions. Keep traces/reports runner-local instead of
      # publishing reusable session/network data as public CI artifacts.

  # IPI-1084 · APPROVAL-001 (PR 2b) — real authenticated browser proof for the
  # ShootPlan review lifecycle: Org A editor allowed, Org A viewer denied, Org B
  # denied, edit invalidates revision N, reload keeps durable state actionable,
  # retry is idempotent, a decision survives an unresumable run, and the whole
  # journey writes zero Shoot rows.
  #
  # Deliberately self-contained: local Supabase + local Next + locally seeded
  # fixtures, so it needs NO repository secrets and cannot touch a hosted
  # project. That is also why it is a separate job from playwright-e2e (which
  # signs into the shared hosted QA accounts and must never point at a local DB).
  # The hosted QA project has no viewer membership and no brands to build this
  # proof from; provisioning one there would mean writing users into a hosted
  # project.
  playwright-approval-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # See supabase-fresh-replay's identical permissions comment: this job
      # also runs `supabase start` and uses the same retry mitigation.
      packages: read
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Route image pulls to ECR (ghcr.io is throttled; setup-cli forces ghcr.io)
        # supabase/setup-cli unconditionally re-exports
        # SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io via $GITHUB_ENV for CLI
        # versions >= 1.28.0 (its own src/main.ts, shouldUseGhcrRegistry()) —
        # a job-level `env:` set before that step runs cannot survive it, but
        # a later step's $GITHUB_ENV write applies to every step after it, so
        # this one (placed after setup-cli) wins instead. Verified locally
        # with a clean image cache: this sequencing actually pulls every
        # image from public.ecr.aws/supabase/* (the CLI's own upstream
        # default), not just proves the var is set (2026-09-23).
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Start local Supabase stack with bounded retry
        # Excludes containers this job never touches. run-approval-001-e2e.mjs
        # only calls GoTrue's admin API (auth) and lets the app read/write
        # through PostgREST via Kong (status.API_URL) plus one direct `pg`
        # connection for fixture seeding and Mastra's PostgresStore — no
        # Supabase Storage, Realtime, or Edge Functions call anywhere in this
        # flow (grepped src/ for storage.from(/.channel(/functions.invoke,
        # zero hits). Verified locally: `supabase start` with this same
        # --exclude list, then `npm run e2e:approval -- --reset`, passed all
        # 8 specs (2026-09-23). Excluding unused services reduces startup
        # work, but Supabase bootstrap may still fetch internal images; the
        # post-setup ECR override is the primary fix and this retry is only
        # a transient-failure backstop.
        run: |
          for attempt in 1 2 3; do
            if supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "supabase start failed (attempt $attempt/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
      - run: supabase db reset --local
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      # scripts/run-approval-001-e2e.mjs refuses any non-loopback Supabase
      # target, mints its fixture users/orgs/brands over the local Supabase APIs
      # (`pg` + GoTrue admin), then runs playwright.approval.config.ts (which
      # starts Next against the local stack). No `psql` client required.
      - run: npm run e2e:approval
      # These tests hold real authenticated local sessions; keep reports
      # runner-local rather than publishing them as public artifacts.

  # Standing guard for IPI-897 planner default ACLs. Files are required on this
  # branch — missing migration/test fails the job instead of skipping.
  planner-default-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure planner defaults, apply migration, run guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
            -- PUBLIC is a pseudo-role; has_*_privilege('public', ...) errors.
            -- ci_acl_probe is a real nologin role that only inherits PUBLIC grants.
            if not exists (select 1 from pg_roles where rolname = 'ci_acl_probe') then
              create role ci_acl_probe nologin nosuperuser;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              create role hyperdrive_mastra_runtime nologin nosuperuser;
            end if;
          end
          $roles$;
          create schema if not exists planner;
          create table if not exists planner.assignments (id int primary key);
          grant select on planner.assignments to authenticated;
          alter default privileges for role postgres in schema planner
            grant all on tables to anon, authenticated, public;
          alter default privileges for role postgres in schema planner
            grant all on sequences to anon, authenticated, public;
          do $pre$
          begin
            create table planner._ipi897_pre (id int primary key);
            if not has_table_privilege('anon', 'planner._ipi897_pre', 'insert')
               or not has_table_privilege('authenticated', 'planner._ipi897_pre', 'insert')
               or not has_table_privilege('ci_acl_probe', 'planner._ipi897_pre', 'insert') then
              raise exception 'CI seed failed: anon/authenticated/PUBLIC (via ci_acl_probe) should inherit INSERT before migration';
            end if;
            drop table planner._ipi897_pre;
          end
          $pre$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260825095051_ipi897_revoke_planner_default_privileges.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901183613_ipi1127_planner_thread_claims.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/default-planner-privileges.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/planner-thread-claims-acl.sql

  # IPI-1122 · SB-MEDIA-HARDEN-001 — media grants, shoot link, get_brand_assets revoke.
  media-harden-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pin reviewed postgres 17 digest (mutable tag rejected on this job).
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure media ACL, apply migration, run guards twice
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-harden-ci-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260902223000_ipi1122_sb_media_harden.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260903120000_ipi1110_v2_shoot_owned_rpc.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-grants-acl.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-org-isolation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/v2-shoot-owned-rpc.sql
          # Second pass (task requires targeted suite twice)
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-grants-acl.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-org-isolation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/v2-shoot-owned-rpc.sql

  # IPI-1074 · PLANS-001 — read-only Planner read contract: org + role gating,
  # enumeration-safe not_found, cursor scoping, literal search, pagination.
  plans-001-read-contract-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pin reviewed postgres 17 digest (mutable tag rejected on this job).
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed planner schema, apply read-contract migration, run proof
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/plans-001-read-contract-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260907120000_plans_001_read_contract.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/plans-001-read-contract.sql

  claim-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENAI_API_KEY: placeholder
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      IPIX_CLAIM_CONCURRENCY: "1"
      MASTRA_DATABASE_URL: postgres://hyperdrive_mastra_runtime:runtime@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply claim table and grants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists planner;
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              create role hyperdrive_mastra_runtime login password 'runtime';
            end if;
          end
          $roles$;
          grant connect on database postgres to hyperdrive_mastra_runtime;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901183613_ipi1127_planner_thread_claims.sql
      - run: npm ci
      - run: npx vitest run tests/access-claim-001.test.ts

  # IPI-1111 · CLD-WEBHOOK-001 — RPC state-machine SQL fixture (idempotency / tenant).
  cloudinary-webhook-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed schema, apply migrations, run SQL fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/cloudinary/apply-cloudinary-ci-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260903020000_ipi1111_apply_cloudinary_asset_event.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260905094610_ipi1111-schema-version-guard.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/cloudinary/apply-cloudinary-asset-events.sql

  # IPI-1147 · SPEC — Remove Unexpected Supabase Privileged Function Access and Prove Tenant-Safe RPCs
  sb-sec-010-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pin reviewed postgres 17 digest (mutable tag rejected on this job).
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure ACL, apply migration, run security regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1147-sb-sec-010-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260904213320_ipi1147_sb_sec_010.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260904213833_ipi1147_sb_sec_010_search_path_fix.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1147-sb-sec-010.sql

  # IPI-1167 · SB-FIX-011 — production's live block_brand_org_change() had
  # drifted from the recovered/local historical body: a NULL-unsafe `!=`
  # comparison and a wrong-id (new.id instead of old.id) reference let a
  # brand's org_id change past the campaign-reference guard whenever org_id
  # was (or became) NULL. Seeds that exact buggy body on a minimal mock
  # schema, applies the real fix migration, and proves the NULL-unsafety
  # is closed in both directions plus the baseline block/allow paths.
  block-brand-org-change-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed buggy body, apply fix migration, run NULL-unsafety regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1167-sb-fix-011-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260907010000_ipi1167_sb_fix_011_block_brand_org_change_null_safety.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1167-sb-fix-011.sql

  # IPI-1162 · SB-MIG-003 — the actual acceptance criterion this task exists
  # to prove: a genuinely fresh Postgres (not a hand-seeded bare container,
  # unlike every job above) replays the full recovered migration chain via
  # the real `supabase start` + `db reset --local` path, then a fixed set of
  # schema/RLS/RPC assertions confirms the result. DB-only — no app E2E
  # needed for a migration-history task.
  #
  # CLI pinned to 2.116.0, not "latest": supabase/cli#6347 is an open
  # regression in 2.115.0/2.116.0 where a pipelined migration batch is not a
  # real transaction block, so a bare LOCK TABLE statement fails 25P01. Two
  # migrations in this chain need an explicit BEGIN/COMMIT to work around it
  # (matching that issue's own suggested fix, not an invented workaround) —
  # pinning keeps this job from silently depending on that exact bug's
  # current behavior if a future CLI version changes how it's handled.
  supabase-fresh-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # `supabase start` pulls the local-dev stack from ghcr.io/supabase/*
      # and hit a sustained `toomanyrequests: allowed 44000/minute` period on
      # 2026-09-23 (three unrelated branches failed identically at the same
      # time; run 35901903158 exhausted all 3 retries pulling even the bare
      # `postgres` image alone once every other container was excluded).
      # Confirmed NOT a tracked GitHub platform incident: githubstatus.com's
      # Packages component reads "operational" throughout, and the one open
      # incident that day (`8zc63m64hy36`) is Projects/issue-label lag, an
      # unrelated component — this is ordinary global ghcr.io/supabase pull
      # contention shared across every GitHub Actions run hitting that image
      # worldwide (matches supabase/cli#419 and other public repos hitting
      # the same "toomanyrequests" pulling ghcr.io/supabase/* in Actions).
      # Authenticating alone was NOT sufficient — still failed after a
      # successful `docker login ghcr.io` — kept anyway below as harmless
      # defense-in-depth. The actual fix is forcing
      # SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws (the CLI's own
      # upstream default before setup-cli overrides it) — an earlier attempt
      # at this failed because it was a job-level `env:`, which is evaluated
      # before any step runs and so is clobbered by supabase/setup-cli's own
      # later $GITHUB_ENV export; setting it as a step placed AFTER
      # setup-cli instead wins for every subsequent step, and was verified
      # locally (clean image cache, `supabase start` genuinely pulled every
      # image from public.ecr.aws/supabase/*, not just accepted the var).
      # The container exclusion below is a second, independent improvement —
      # less to pull either way — not a substitute for the registry fix.
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Route image pulls to ECR (ghcr.io is throttled; setup-cli forces ghcr.io)
        # See playwright-approval-tenant's identical step for the full
        # explanation: a job-level `env:` cannot survive supabase/setup-cli's
        # own later $GITHUB_ENV export, but a step placed after it can.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prime postgres-meta image for type generation
        # `supabase gen types --db-url` still launches a short-lived
        # postgres-meta:v0.98.0 container in the pinned Supabase CLI 2.116.0,
        # so this job primes that image before generated-type verification.
        # The ECR override above also disables the CLI's own registry
        # fallback, so the script prefers ECR and, only if ECR fails or
        # throttles, pulls the identical upstream mirror from authenticated
        # GHCR and tags it with the exact name the CLI requests. If both
        # registries fail, the step fails — the type gate is never skipped.
        run: bash scripts/prime-supabase-pgmeta.sh
      - name: Start local Supabase stack with bounded retry
        # This job is DB-only. Most assertions are raw `psql`/`pg` against
        # port 54322. `supabase gen types --db-url` still runs a short-lived
        # postgres-meta container, so the step above primes that one image.
        # Nothing here goes through Kong/GoTrue/PostgREST/Storage/Realtime/
        # Edge Functions, so every non-Postgres container is excludable, not
        # just the admin/observability ones. Verified locally: `supabase
        # start` with this same --exclude list, then `supabase db reset
        # --local` plus the full assertion sequence below (all 20+
        # files/scripts), passed end to end (2026-09-23). The final running
        # stack is DB-only, but Supabase bootstrap may still fetch internal
        # images while initializing; the ECR override covers those pulls too.
        # The retry loop is only a transient-failure backstop.
        run: |
          for attempt in 1 2 3; do
            if supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "supabase start failed (attempt $attempt/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
      - run: supabase db reset --local
      - name: Verify generated Supabase types are deterministic and current
        run: |
          node scripts/generate-supabase-types.mjs --check
          node scripts/generate-supabase-types.mjs --check
      - name: Schema / RLS / RPC assertions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing_schema text;
            rls_gap_count int;
            planner_rpc_count int;
            leftover_shadow_count int;
          begin
            select string_agg(s, ', ') into missing_schema
            from unnest(array['public','planner','mastra','shoot','talent']) s
            where not exists (select 1 from pg_namespace where nspname = s);
            if missing_schema is not null then
              raise exception 'fresh replay missing schema(s): %', missing_schema;
            end if;

            select count(*) into rls_gap_count
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname in ('public','planner','mastra','shoot','talent')
              and c.relkind = 'r'
              and not c.relrowsecurity;
            if rls_gap_count > 0 then
              raise exception 'fresh replay: % table(s) without RLS enabled across the 5 schemas', rls_gap_count;
            end if;

            select count(*) into planner_rpc_count
            from pg_proc where pronamespace = 'public'::regnamespace and proname like 'planner_%';
            if planner_rpc_count < 10 then
              raise exception 'fresh replay: expected >= 10 planner_* RPCs, found %', planner_rpc_count;
            end if;

            select count(*) into leftover_shadow_count
            from pg_tables where schemaname = 'public' and tablename like 'mastra\_%' escape '\';
            if leftover_shadow_count <> 0 then
              raise exception 'fresh replay: % leftover public.mastra_* shadow table(s) after cutover', leftover_shadow_count;
            end if;

            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              raise exception 'fresh replay: hyperdrive_mastra_runtime role missing';
            end if;

            if not exists (select 1 from pg_trigger where tgname = 'on_auth_user_created' and tgrelid = 'auth.users'::regclass) then
              raise exception 'fresh replay: on_auth_user_created trigger missing on auth.users';
            end if;
          end $$;
          SQL

          # Reusable deterministic subset of Supabase security-Advisor/catalog checks.
          # Hosted Advisors are not available against local Docker, so keep this to
          # invariants we can prove from pg_catalog without production access.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/catalog-security-regression.sql

          # IPI-1118 · SHOOT-ASSETS-001 — canonical V2 asset read path regression.
          # Runs against the full fresh migration chain including IPI-1122.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1118-shoot-assets-canonical-read.sql

          # IPI-1119 · MEDIA-APPROVAL-001 — exact-version approval/rejection,
          # staleness, overwrite-reset invariant, idempotency, tenant/role denial.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1119-media-approval.sql

          # IPI-644 · SHOOT-DATA-002C — reference logical key + server-only exact
          # media mapping + least-privilege reference view/function grants.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi644-reference-media-grants.sql

          # IPI-1084 · APPROVAL-001 — exact-revision ShootPlan approval record:
          # org-scoped read-only for clients, RPC-only writes, immutable revision
          # identity, plus a behavioural identity-lock and RLS denial probe.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1084-shoot-plan-approval-acl.sql

          # IPI-1084 · APPROVAL-001 — two-session proof that staging and deciding
          # one planner run serialise on the shared run advisory lock, with a
          # negative control on an unrelated key so the timing assertion cannot
          # pass vacuously.
          bash supabase/tests/security/ipi1084-shoot-plan-approval-lock.sh 54322

          # IPI-1083 · SHOOT-SAVE-001 — exact approved artifact → one durable
          # Shoot, with normalized child/provenance mapping, tenant/role denials,
          # rejected/superseded zero-write behavior, replay, and true two-session
          # concurrent double-submit proof.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1083-save-approved-shoot.sql
          bash supabase/tests/security/ipi1083-save-approved-shoot-concurrency.sh 54322

          # End-to-end proof, not just schema-level: a real signup on this
          # fresh database must actually produce a profiles row (the exact
          # bug this task's own review caught and fixed).
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, aud, role, email, email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values ('11111111-1111-4111-8111-111111111111','authenticated','authenticated','ci-fresh-replay@ipix.test',now(),'{"provider":"email"}'::jsonb,'{"full_name":"CI Fresh Replay"}'::jsonb,now(),now());
          do $$
          begin
            if not exists (select 1 from public.profiles where id = '11111111-1111-4111-8111-111111111111') then
              raise exception 'fresh replay: signup did not create a profiles row';
            end if;
          end $$;
          SQL

          # IPI-1163 · SB-SEC — proposed retirement of the anon demo-event
          # policies (PROPOSED pending explicit product/security
          # authorization, not yet applied to production — see the
          # migration's own header and the IPI-1163 deployment plan).
          # Needs the real events/event_phases/event_schedules/ticket_tiers
          # + auth.users schema from the full replay above, not a bare-
          # Postgres mock, so it runs here rather than as its own job.
          # Seeds production's live-only sentinel policies (never in git
          # per IPI-1162's Case B decision) on top of this already-migrated
          # database, then re-applies the retirement migration (already
          # ran once during the replay above as a same-environment no-op;
          # re-running it here is what actually removes the just-seeded
          # live-drift policies) and proves anon write access is closed.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1163-sb-sec-seed-live-drift.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1163-sb-sec-pre-check.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260907020000_ipi1163_sb_sec_retire_anon_demo_event_policies.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260907030000_ipi1163_sb_sec_tighten_brand_scores_select_via_brand.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260907040000_ipi1163_sb_sec_revoke_excess_anon_grants.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1163-sb-sec.sql

          # IPI-1093 · BRAND-INTEL-001 (task-verifier finding) — org isolation
          # for get_brand_draft_snapshot. Needs the real auth.users/
          # organizations schema from the full replay above, not a bare-
          # Postgres mock, so it runs here rather than as its own job.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1093-brand-draft-snapshot-isolation.sql

          # IPI-1093 · BRAND-INTEL-001 blocker #2 (PR review finding) — this
          # file existed and passed locally every time it was run this task,
          # but was never wired into this job, so it provided zero CI
          # regression protection for the DB write-boundary fix (direct-write
          # denial, INSERT-fabrication denial, cross-org, stale-hash, replay,
          # reject-preserves-prior). Same reason as the snapshot-isolation
          # test above: needs the real auth.users/organizations/org_members
          # schema from the full replay.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1093-brand-db-write-boundary.sql

          # IPI-1348 · BRAND-INTEL-PROD-002 — stale crawl_running recovery
          # through the existing expire_stale_brand_analysis() cron function.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1348-expire-stale-brand-crawl.sql

          # IPI-1093 · BRAND-INTEL-001 (external audit finding) — the
          # queued-crawl claim in start-brand-crawl/handler.ts needs two
          # genuinely concurrent database sessions to prove, which the
          # single-connection `psql -f file.sql` pattern above can't express.
          # Shell script, not SQL: seeds a real queued/unclaimed crawl row
          # and asserts exactly one of two simultaneous claim attempts wins.
          bash supabase/tests/security/ipi1093-brand-crawl-claim-concurrency.sh

          # IPI-1269 · ONBOARD-DB-GUARD-001 — regression proof that a normal
          # authenticated client cannot forge materialize_onboarding_session's
          # outcome (status/organization_id/brand_id), cannot read/mutate
          # another user's onboarding session, cannot spoof user_id, and that
          # the trusted RPC's happy path, replay, and two-users-same-key-text
          # isolation all still behave correctly. Needs the real
          # auth.users/organizations/org_members/brands schema from the full
          # replay above, not a bare-Postgres mock.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1269-onboard-db-guard-acl.sql

          # IPI-1269 · ONBOARD-DB-GUARD-001 — concurrent double-submit proof:
          # two overlapping materialize_onboarding_session calls for the same
          # (user_id, idempotency_key) must still leave exactly one
          # organization/brand/owner-member, both calls returning the same
          # durable IDs. Same reason as the IPI-1093 claim-concurrency script
          # above: genuinely needs two overlapping sessions.
          bash supabase/tests/security/ipi1269-onboard-db-guard-concurrency.sh

          # IPI-1311 · AUTH-ORG-SINGLE-001 — org_members(user_id) unique
          # invariant: a direct duplicate insert is rejected, an existing
          # single membership is untouched by the rejected attempt, and
          # organizations_auto_add_owner fails the whole organizations
          # INSERT atomically for an already-member owner (no orphaned/
          # partial organization) rather than silently swallowing the
          # conflict. Needs the real auth.users/organizations/org_members
          # schema plus this task's own migrations from the full replay
          # above, not a bare-Postgres mock.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1311-org-members-single-membership.sql
      - run: supabase stop

  # IPI-1205 · SB-EDGE-CI-001 — native Deno regression tests + frozen
  # typecheck for Supabase Edge Functions. Vitest's `include` (see
  # vitest.config.ts) never discovers `supabase/functions/**/*.test.ts`, so
  # Deno.test cases such as allowlist.test.ts previously ran manually only;
  # this job is what actually gates them in CI. Isolated from build/replay:
  # pure Deno unit tests + typecheck, no Node/Postgres/Supabase stack needed.
  edge-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.2"
      - working-directory: supabase
        run: deno ci
      - working-directory: supabase
        run: deno task test
      - working-directory: supabase
        run: >
          deno check --frozen
          functions/brand-intelligence/index.ts
          functions/start-brand-crawl/index.ts
          functions/firecrawl-webhook/index.ts

  # IPI-1229 · VERCEL-OPT-001 / IPI-1238 · VERCEL-RELEASE-001 — Production is
  # released ONLY by an explicit manual dispatch of this workflow on main.
  #
  # Every merge to main still runs the full CI suite above, but creates NO
  # Production deployment. Deploying on push is what made deployment storage grow
  # once per merge (17 merges -> 17 Production artifacts); releasing is now an
  # intentional act, not a side effect of merging.
  #
  # RELEASE SWITCH: `VERCEL_ACTIONS_PRODUCTION_ENABLED`
  # (repository variable: Settings -> Secrets and variables -> Actions ->
  # Variables).
  #
  #   'true'                  -> deploy the dispatched main SHA to Production.
  #   'false'                 -> deliberately skip the deploy; the run warns.
  #   unset / anything else   -> this job FAILS with ::error.
  #
  # The switch is validated INSIDE the job, never in the job-level `if:`. A
  # job-level condition reports conclusion=skipped, which is not a failure — so
  # an unset variable would silently release nothing. IPI-1238 sets
  # `git.deploymentEnabled: false`, which makes this job the ONLY production
  # path, so a silent skip would mean releases stop while CI stays green.
  vercel-production:
    needs:
      - build
      - playwright-e2e
      - playwright-approval-tenant
      - planner-default-acl
      - media-harden-acl
      - plans-001-read-contract-acl
      - claim-concurrency
      - cloudinary-webhook-rpc
      - sb-sec-010-acl
      - block-brand-org-change-acl
      - supabase-fresh-replay
      - edge-deno
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Require a valid Production release switch
        id: release
        shell: bash
        env:
          PRODUCTION_ENABLED: ${{ vars.VERCEL_ACTIONS_PRODUCTION_ENABLED }}
        run: |
          set -euo pipefail
          case "$PRODUCTION_ENABLED" in
            true)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Production release is switched off::VERCEL_ACTIONS_PRODUCTION_ENABLED=false and vercel.json sets git.deploymentEnabled=false, so this repository currently has NO production release path. ${GITHUB_SHA} merges without deploying."
              ;;
            *)
              echo "::error title=Production release switch is not set::VERCEL_ACTIONS_PRODUCTION_ENABLED must be exactly 'true' or 'false', but is '${PRODUCTION_ENABLED:-<unset>}'."
              echo "::error::vercel.json sets git.deploymentEnabled=false, so Vercel Git no longer deploys main. With this switch unset or malformed there is no production path at all — which used to fail silently as a skipped job. Set the repository variable to 'true' (Settings -> Secrets and variables -> Actions -> Variables) to release, or restore git.deploymentEnabled."
              exit 1
              ;;
          esac

      - name: Checkout exact CI-tested SHA
        if: steps.release.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        if: steps.release.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refuse stale main SHA before build
        id: latest
        if: steps.release.outputs.enabled == 'true'
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_sha="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$latest_sha" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI SHA $TESTED_SHA; latest main is $latest_sha"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Require Vercel deployment credential
        id: credentials
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_ACTIONS_PRODUCTION_ENABLED is true but VERCEL_TOKEN is missing."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned Vercel CLI
        if: steps.latest.outputs.deploy == 'true' && steps.credentials.outputs.configured == 'true'
        run: npm install --global vercel@59.23.1

      - name: Pull Production environment
        if: steps.latest.outputs.deploy == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact SHA for Production
        if: steps.latest.outputs.deploy == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact latest SHA to Production
        if: steps.latest.outputs.deploy == 'true' && steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_sha="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$latest_sha" ]; then
            echo "Skipping deploy: tested SHA $TESTED_SHA is no longer latest main ($latest_sha)."
            exit 0
          fi
          vercel deploy --prebuilt --prod \
            --meta githubCommitSha="$TESTED_SHA" \
            --meta githubCommitRef=main \
            --token="$VERCEL_TOKEN"
